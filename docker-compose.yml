# The database for MMH Leave: PostgreSQL 16 in Docker. (The app itself runs with Node, not Docker.)
#   Start:  docker compose up -d        Stop:  docker compose stop
# Data is kept in the named volume below, so it survives restarts and computer reboots.
# The optional values come from .env (see .env.example); the defaults match DATABASE_URL there.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER:-midsalip-postgres}
    environment:
      POSTGRES_DB: midsalip_leave
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      # 127.0.0.1 = reachable from THIS computer only (the app), never from other computers on the Wi-Fi.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d midsalip_leave"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped # starts again by itself when Docker Desktop starts

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-midsalip-pgdata}
